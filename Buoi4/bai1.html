<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý Bảng Điểm Sinh Viên</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            max-width: 800px;
        }
        .input-group, .filter-group {
            margin-bottom: 20px;
            display: flex;
            gap: 10px;
        }
        input, select {
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
            flex: 1;
        }
        button {
            padding: 8px 15px;
            cursor: pointer;
            background-color: #007BFF;
            color: white;
            border: none;
            border-radius: 4px;
            font-weight: bold;
        }
        button:hover {
            background-color: #0056b3;
        }
        hr {
            border: 1px solid #eee;
            margin-bottom: 20px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 20px;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 10px;
            text-align: center;
        }
        th {
            background-color: #f4f4f4;
        }
        .sortable {
            cursor: pointer;
            user-select: none;
        }
        .sortable:hover {
            background-color: #e2e2e2;
        }
        #iconSort {
            display: inline-block;
            width: 15px;
            color: #555;
        }
        .weak-student {
            background-color: yellow;
        }
        .delete-btn {
            background-color: #dc3545;
            padding: 5px 10px;
            font-size: 0.9em;
        }
        .delete-btn:hover {
            background-color: #c82333;
        }
        .stats {
            font-weight: bold;
            font-size: 1.1em;
            padding: 10px;
            background-color: #f8f9fa;
            border: 1px solid #ddd;
            border-radius: 4px;
        }
        .no-results {
            color: #777;
            font-style: italic;
        }
    </style>
</head>
<body>

    <h2>Quản lý Điểm Sinh Viên</h2>

    <div class="input-group">
        <input type="text" id="hoTen" placeholder="Họ tên sinh viên">
        <input type="number" id="diem" placeholder="Điểm (0-10)" min="0" max="10" step="0.1">
        <button id="btnThem">Thêm</button>
    </div>

    <hr>

    <div class="filter-group">
        <input type="text" id="timKiem" placeholder="Tìm kiếm theo tên...">
        <select id="locXepLoai">
            <option value="Tất cả">Lọc theo xếp loại: Tất cả</option>
            <option value="Giỏi">Giỏi (>= 8.5)</option>
            <option value="Khá">Khá (>= 7.0)</option>
            <option value="Trung bình">Trung bình (>= 5.0)</option>
            <option value="Yếu">Yếu (< 5.0)</option>
        </select>
    </div>

    <table>
        <thead>
            <tr>
                <th>STT</th>
                <th>Họ tên</th>
                <th id="cotDiem" class="sortable" title="Click để sắp xếp">Điểm <span id="iconSort"></span></th>
                <th>Xếp loại</th>
                <th>Thao tác</th>
            </tr>
        </thead>
        <tbody id="danhSachSinhVien">
            </tbody>
    </table>

    <div class="stats">
        Đang hiển thị: <span id="tongSV">0</span> sinh viên | 
        Điểm trung bình: <span id="diemTB">0.00</span>
    </div>

    <script>
        // Mảng gốc và mảng hiển thị
        let danhSach = [];
        let filteredDanhSach = [];
        let sortOrder = ''; 

        const inputHoTen = document.getElementById('hoTen');
        const inputDiem = document.getElementById('diem');
        const btnThem = document.getElementById('btnThem');
        const inputTimKiem = document.getElementById('timKiem');
        const selectLoc = document.getElementById('locXepLoai');
        const cotDiem = document.getElementById('cotDiem');
        const iconSort = document.getElementById('iconSort');
        const tbodySinhVien = document.getElementById('danhSachSinhVien');
        const spanTongSV = document.getElementById('tongSV');
        const spanDiemTB = document.getElementById('diemTB');

        // Tính xếp loại
        function xepLoai(diem) {
            if (diem >= 8.5) return 'Giỏi';
            if (diem >= 7.0) return 'Khá';
            if (diem >= 5.0) return 'Trung bình';
            return 'Yếu';
        }

        // Xử lý Tìm kiếm + Lọc + Sắp xếp
        function applyFilters() {
            const keyword = inputTimKiem.value.trim().toLowerCase();
            const loai = selectLoc.value;

            filteredDanhSach = danhSach.filter(sv => {
                const matchName = sv.hoTen.toLowerCase().includes(keyword);
                const matchLoai = (loai === 'Tất cả') || (xepLoai(sv.diem) === loai);
                return matchName && matchLoai;
            });

            if (sortOrder === 'asc') {
                filteredDanhSach.sort((a, b) => a.diem - b.diem);
                iconSort.innerHTML = '&#9650;';
            } else if (sortOrder === 'desc') {
                filteredDanhSach.sort((a, b) => b.diem - a.diem);
                iconSort.innerHTML = '&#9660;';
            } else {
                iconSort.innerHTML = '';
            }

            renderTable();
        }

        // Render bảng
        function renderTable() {
            tbodySinhVien.innerHTML = '';
            let tongDiem = 0;

            if (filteredDanhSach.length === 0) {
                tbodySinhVien.innerHTML = '<tr><td colspan="5" class="no-results">Không có kết quả</td></tr>';
                spanTongSV.textContent = 0;
                spanDiemTB.textContent = "0.00";
                return;
            }

            filteredDanhSach.forEach((sv, index) => {
                const tr = document.createElement('tr');
                if (sv.diem < 5.0) tr.classList.add('weak-student');

                tr.innerHTML = `
                    <td>${index + 1}</td>
                    <td>${sv.hoTen}</td>
                    <td>${sv.diem.toFixed(1)}</td>
                    <td>${xepLoai(sv.diem)}</td>
                    <td><button class="delete-btn" data-id="${sv.id}">Xóa</button></td>
                `;
                tbodySinhVien.appendChild(tr);
                tongDiem += sv.diem;
            });

            const tongSo = filteredDanhSach.length;
            spanTongSV.textContent = tongSo;
            spanDiemTB.textContent = (tongDiem / tongSo).toFixed(2);
        }

        // Thêm sinh viên
        function themSinhVien() {
            const hoTen = inputHoTen.value.trim();
            const diem = parseFloat(inputDiem.value.trim());

            if (hoTen === '') return alert('Vui lòng nhập họ tên sinh viên!');
            if (isNaN(diem) || diem < 0 || diem > 10) return alert('Vui lòng nhập điểm hợp lệ (từ 0 đến 10)!');

            danhSach.push({
                id: Date.now(), // Dùng id để xóa không bị nhầm khi lọc
                hoTen: hoTen,
                diem: diem
            });

            inputHoTen.value = '';
            inputDiem.value = '';
            inputHoTen.focus();

            applyFilters();
        }

        // Gắn sự kiện
        btnThem.addEventListener('click', themSinhVien);
        inputDiem.addEventListener('keypress', e => { if (e.key === 'Enter') themSinhVien(); });
        inputTimKiem.addEventListener('input', applyFilters);
        selectLoc.addEventListener('change', applyFilters);
        
        cotDiem.addEventListener('click', () => {
            if (sortOrder === '' || sortOrder === 'desc') sortOrder = 'asc';
            else sortOrder = 'desc';
            applyFilters();
        });

        // Xóa sinh viên
        tbodySinhVien.addEventListener('click', e => {
            if (e.target.classList.contains('delete-btn')) {
                const idCanXoa = parseInt(e.target.getAttribute('data-id'));
                danhSach = danhSach.filter(sv => sv.id !== idCanXoa);
                applyFilters();
            }
        });
    </script>
</body>
</html>
